<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Transparent background: just the white teardrop and the orange prohibition ring + slash -->
  <defs>
    <clipPath id="teardrop-clip">
      <path d="M256 96 C256 96 148 232 148 312 C148 374 196 420 256 420 C316 420 364 374 364 312 C364 232 256 96 256 96 Z" />
    </clipPath>
  </defs>

  <!-- Stark Geometric Teardrop (White Ink) -->
  <path
    d="M256 96 C256 96 148 232 148 312 C148 374 196 420 256 420 C316 420 364 374 364 312 C364 232 256 96 256 96 Z"
    fill="#FFFFFF"
  />
  <!-- Inner Brutalist Cutout / Highlight on Teardrop -->
  <path
    d="M210 296 C204 328 220 360 252 368"
    fill="none"
    stroke="#101010"
    stroke-width="22"
    stroke-linecap="square"
  />

  <!-- Dark gap either side of the slash, only where it crosses the teardrop -->
  <line
    x1="108"
    y1="404"
    x2="404"
    y2="108"
    stroke="#101010"
    stroke-width="68"
    stroke-linecap="butt"
    clip-path="url(#teardrop-clip)"
  />

  <!-- Circular Prohibition Ring (#FF6B00) -->
  <circle cx="256" cy="256" r="204" fill="none" stroke="#FF6B00" stroke-width="40" />

  <!-- Diagonal Prohibition Slash Across Teardrop -->
  <line x1="112" y1="400" x2="400" y2="112" stroke="#FF6B00" stroke-width="40" stroke-linecap="butt" />
</svg>
