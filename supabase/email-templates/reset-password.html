<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="supported-color-schemes" content="dark">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body style="margin:0;padding:0;background-color:#000000;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#000000;">
<tr><td align="center" style="padding:32px 16px;font-family:'Chakra Petch', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:440px;">
    <tr><td style="padding:0 4px 16px 4px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
        <td style="padding-right:12px;vertical-align:middle;"><img src="{{ .SiteURL }}/apple-icon.png" width="36" height="36" alt="" style="display:block;border:0;border-radius:10px;"></td>
        <td style="vertical-align:middle;font-family:'Chakra Petch', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:13px;font-weight:500;letter-spacing:0.1em;color:#FFFFFF;text-transform:uppercase;">You can&rsquo;t cry in here</td>
      </tr></table>
    </td></tr>
    <tr><td style="background-color:#1C1C1C;border-radius:14px;padding:24px 20px;">
      <div style="font-family:'Chakra Petch', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:11px;font-weight:500;letter-spacing:0.1em;color:#9A9A9A;text-transform:uppercase;margin:0 0 10px 0;">Reset password</div>
      <div style="font-family:'Chakra Petch', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:22px;font-weight:300;line-height:1.35;color:#FFFFFF;margin:0 0 12px 0;">Set a new password for your account.</div>
      <div style="font-family:'Chakra Petch', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:14px;font-weight:400;line-height:1.5;color:#BDBDBD;margin:0 0 20px 0;">The link works once and expires soon.</div>
      
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
        <td align="center" style="background-color:#E20612;border-radius:12px;">
          <a href="{{ .ConfirmationURL }}" style="display:block;padding:16px 20px;font-family:'Chakra Petch', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:13px;font-weight:600;letter-spacing:0.08em;color:#FFFFFF;text-decoration:none;text-transform:uppercase;">Set new password</a>
        </td>
      </tr></table>
      <div style="font-family:'Chakra Petch', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:12px;line-height:1.5;color:#8A8A8A;margin:16px 0 0 0;">Or open this link:<br><a href="{{ .ConfirmationURL }}" style="color:#BDBDBD;word-break:break-all;">{{ .ConfirmationURL }}</a></div>
    </td></tr>
    <tr><td style="padding:16px 4px 0 4px;font-family:'Chakra Petch', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:12px;line-height:1.5;color:#8A8A8A;">You got this because a password reset was asked for {{ .Email }}. If it wasn&#39;t you, ignore it: your password stays the same.</td></tr>
  </table>
</td></tr>
</table>
</body>
</html>
