# Keeps the web app's features working on every pull request and push to main: the unit tests (including the check
# that every feature in WEB_FEATURES.md has a smoke test) and the Playwright smoke tests against a production build.
# To make it block merging, add "web features" as a required check in GitHub → Settings → Branches → main.
name: web features

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web-features:
    name: web features
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Unit tests and web feature smoke tests
        run: npm run check:web
        env:
          CI: 'true'
      - name: Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
